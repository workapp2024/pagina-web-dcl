name: DCL smart search validation

on:
  pull_request:
    branches: [master]
  push:
    branches: [feature/smart-search-mundo-parity]

permissions:
  contents: read

jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm GitHub runner starts
        run: echo "runner operational"
  validate:
    needs: runner-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Existing regression tests
        run: npm run test:store
      - name: ESLint
        run: npm run lint
      - name: Build
        run: npm run build
